# Render "Blueprint": tells Render how to run this project.
# Render provides HTTPS automatically, and keeps secrets in its Environment screen.
services:
  - type: web
    name: shoppybae-voice
    runtime: node
    plan: free
    buildCommand: node --version        # nothing to install: this project has no npm dependencies
    startCommand: node src/server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: TRUST_PROXY_HOPS            # Render puts 1 proxy in front; needed for correct per-IP rate limits
        value: "1"
      - key: SESSION_SECRET              # generated by Render; you never see or type it
        generateValue: true
      - key: GEMINI_API_KEY              # you paste this in Render's screen (see README)
        sync: false
      - key: ACCESS_CODE                 # you choose this in Render's screen (see README)
        sync: false
      - key: ALLOWED_ORIGINS             # optional: add your main website later
        sync: false
